name: unit-tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.1'
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee test-output.txt

    - name: Generate coverage summary
      run: |
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Extract coverage lines from test output (format: "ok      package/path    coverage: X.X%")
        grep -E "^(ok|FAIL)\s+github.com/jacklei/polaris" test-output.txt | sed 's/^ok[[:space:]]*/ok      /' | sed 's/^FAIL[[:space:]]*/FAIL    /' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        # Calculate overall coverage
        TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
        echo "**Overall Coverage: $TOTAL_COVERAGE**" >> $GITHUB_STEP_SUMMARY

